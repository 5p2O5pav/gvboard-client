<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVBoard OSS 配置加密</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.55 system-ui, sans-serif; }
  body { max-width: 50rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; font-weight: 600; margin: 1.25rem 0 .35rem; }
  input, textarea, button { box-sizing: border-box; font: inherit; }
  input, textarea { display: block; width: 100%; padding: .6rem; border: 1px solid GrayText; border-radius: .5rem; }
  input, textarea { font-family: ui-monospace, Consolas, monospace; }
  textarea { resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .65rem; }
  button { padding: .4rem .8rem; cursor: pointer; }
  button:disabled { cursor: default; }
  #status[data-error] { color: light-dark(#ad2525, #ff9b9b); }
</style>
<main>
  <h1>GVBoard OSS 配置加密</h1>
  <p>在浏览器本地加密明文 JSON。下载的 <code>demo.oss</code> 可直接上传到 OSS；同一密钥用于构建参数 <code>GVBOARD_OSS_KEY</code>。请妥善保存密钥。</p>

  <label for="key">加密密钥（32 字节 Base64 或 64 位十六进制）</label>
  <input id="key" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
  <div class="actions">
    <button id="generate" type="button">生成随机密钥</button>
    <button id="copy-key" type="button">复制密钥</button>
  </div>

  <label for="plaintext">明文配置（JSON）</label>
  <textarea id="plaintext" rows="12" spellcheck="false" placeholder='{"schema_version":1,"oss_id":"demo", ...}'></textarea>
  <div class="actions"><button id="encrypt" type="button">加密</button></div>

  <label for="output">加密结果（Base64）</label>
  <textarea id="output" rows="7" readonly spellcheck="false"></textarea>
  <div class="actions">
    <button id="copy-output" type="button" disabled>复制结果</button>
    <button id="download" type="button" disabled>下载 demo.oss</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  'use strict';

  const byId = id => document.getElementById(id);
  const keyField = byId('key');
  const plaintext = byId('plaintext');
  const output = byId('output');
  const encryptButton = byId('encrypt');
  const copyOutput = byId('copy-output');
  const download = byId('download');
  const status = byId('status');
  let revision = 0;

  function notify(message, error = false) {
    status.textContent = message;
    status.toggleAttribute('data-error', error);
  }

  function encodeBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) {
      binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    }
    return btoa(binary);
  }

  function decodeKey(value) {
    const text = value.trim();
    if (/^[0-9a-f]{64}$/i.test(text)) {
      return Uint8Array.from(text.match(/../g), pair => parseInt(pair, 16));
    }
    let binary;
    try {
      binary = atob(text);
    } catch (_) {
      throw new Error('密钥不是有效的 Base64 或十六进制。');
    }
    if (binary.length !== 32) throw new Error('密钥解码后必须正好是 32 字节。');
    return Uint8Array.from(binary, char => char.charCodeAt(0));
  }

  function setOutput(value) {
    output.value = value;
    copyOutput.disabled = download.disabled = !value;
  }

  function invalidate() {
    revision++;
    setOutput('');
    notify('');
  }

  async function copy(field, message) {
    if (!field.value) return;
    try {
      await navigator.clipboard.writeText(field.value);
      notify(message);
    } catch (_) {
      field.focus();
      field.select();
      notify('内容已选中，请按 Ctrl+C 或使用系统的复制操作。');
    }
  }

  keyField.addEventListener('input', invalidate);
  plaintext.addEventListener('input', invalidate);
  byId('generate').addEventListener('click', () => {
    keyField.value = encodeBase64(crypto.getRandomValues(new Uint8Array(32)));
    invalidate();
    notify('已生成新的随机密钥。');
  });
  byId('copy-key').addEventListener('click', () => copy(keyField, '密钥已复制。'));
  copyOutput.addEventListener('click', () => copy(output, '加密结果已复制。'));

  encryptButton.addEventListener('click', async () => {
    invalidate();
    const started = revision;
    encryptButton.disabled = true;
    try {
      if (!globalThis.crypto?.subtle) {
        throw new Error('当前环境不支持 Web Crypto，请用现代浏览器直接打开此文件，或通过 HTTPS / localhost 打开。');
      }
      const raw = plaintext.value;
      let config;
      try {
        config = JSON.parse(raw);
      } catch (_) {
        throw new Error('请输入有效的 JSON。');
      }
      if (!config || typeof config !== 'object' || Array.isArray(config)) {
        throw new Error('OSS 配置必须是 JSON 对象。');
      }
      const key = await crypto.subtle.importKey('raw', decodeKey(keyField.value), 'AES-GCM', false, ['encrypt']);
      const nonce = crypto.getRandomValues(new Uint8Array(12));
      const sealed = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: nonce, tagLength: 128 }, key, new TextEncoder().encode(raw)
      ));
      // Gvboard expects nonce || ciphertext || tag, wrapped in Base64.
      const payload = new Uint8Array(nonce.length + sealed.length);
      payload.set(nonce);
      payload.set(sealed, nonce.length);
      if (started !== revision) return;
      setOutput(encodeBase64(payload));
      notify('加密完成，可以复制结果或下载文件。');
    } catch (error) {
      if (started === revision) notify(error.message, true);
    } finally {
      encryptButton.disabled = false;
    }
  });

  download.addEventListener('click', () => {
    if (!output.value) return;
    const href = URL.createObjectURL(new Blob([output.value], { type: 'text/plain' }));
    const link = document.createElement('a');
    link.href = href;
    link.download = 'demo.oss';
    link.click();
    setTimeout(() => URL.revokeObjectURL(href), 1000);
  });
</script>
</html>
